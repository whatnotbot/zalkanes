[package]
name = "zalkanes-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha2 = "0.10"
zalkanes-core     = { path = "../crates/zalkanes-core" }
zalkanes-protocol = { path = "../crates/zalkanes-protocol" }
zalkanes-carrier  = { path = "../crates/zalkanes-carrier" }
zalkanes-runtime  = { path = "../crates/zalkanes-runtime" }
zalkanes-state    = { path = "../crates/zalkanes-state" }

# Standalone project: deliberately NOT a member of the root workspace (fuzz
# builds run on nightly with sanitizer flags the workspace does not use).
[workspace]

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carrier_decoder"
path = "fuzz_targets/carrier_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "carrier_scripts"
path = "fuzz_targets/carrier_scripts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_validator"
path = "fuzz_targets/wasm_validator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_transition"
path = "fuzz_targets/state_transition.rs"
test = false
doc = false
bench = false
