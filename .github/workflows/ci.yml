name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check --all

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (dev)
        run: cargo test --workspace

      - name: cargo test (release)
        run: cargo test --release --workspace

  shielded-wallet:
    name: shielded wallet (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (shielded)
        run: cargo clippy -p zalkanes-wallet --features shielded --all-targets -- -D warnings
      - name: cargo test (shielded)
        run: cargo test -p zalkanes-wallet --features shielded

  contracts:
    name: contract builds (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build counter
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/counter/Cargo.toml
      - name: Build key-value
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/key-value/Cargo.toml
      - name: Build token
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/token/Cargo.toml
      - name: Build caller
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/caller/Cargo.toml

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to v2 (cargo-deny 0.20.2); deny.toml uses the 0.20.x schema.
      # cargo-deny 0.20.2 reads Cargo.lock directly (which already contains the
      # full dependency union, including the `shielded`-feature crates), so no
      # feature flag is needed -- and `--all-features` is not a valid
      # `check` argument in this version.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check