name: competing-branch-regtest

# Private, ephemeral, two-node regtest. NEVER touches the public testnet Zebra
# service or any Railway volume: both nodes are downloaded pinned releases run
# on a throwaway runner filesystem and torn down with the job.
on:
  push:
    branches: [mainnet-readiness, 'reorg/**']
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    name: competing-chain probe (pinned zebrad v6.3.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZEBRAD_RELEASE: 6.3.0
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned zebrad release (verified checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_RELEASE}"
          FILE="zebrad-${ZEBRAD_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "$BASE/$FILE"
          curl -sSLO "$BASE/$FILE.sha256"
          sha256sum -c "$FILE.sha256"
          tar xzf "$FILE"
          find . -name zebrad -type f -exec cp {} /usr/local/bin/zebrad \;
          chmod +x /usr/local/bin/zebrad
          zebrad --version

      - name: start two isolated regtest nodes (A and B)
        run: |
          set -euo pipefail
          start_node () {
            NAME="$1"; RPC="$2"; P2P="$3"
            mkdir -p "/tmp/zebra-$NAME"
            cat > "/tmp/zebra-$NAME/zebrad.toml" <<ZCFG
          [network]
          network = { regtest = true, params = { activation_heights = { NU5 = 1, NU6 = 1, "NU6.1" = 1, "NU6.2" = 1, "NU6.3" = 1 } } }
          listen_addr = "127.0.0.1:$P2P"
          initial_mainnet_peers = []
          initial_testnet_peers = []
          cache_dir = "/tmp/zebra-$NAME/net"

          [state]
          cache_dir = "/tmp/zebra-$NAME/state"
          ephemeral = true

          [sync]
          checkpoint_verify_concurrency_limit = 2
          download_concurrency_limit = 2

          [consensus]
          checkpoint_sync = false

          [rpc]
          listen_addr = "127.0.0.1:$RPC"
          enable_cookie_auth = false

          [mining]
          internal_miner = false
          miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
          ZCFG
            echo "── node $NAME config ──"; cat "/tmp/zebra-$NAME/zebrad.toml"
            zebrad -c "/tmp/zebra-$NAME/zebrad.toml" start > "/tmp/zebrad-$NAME.log" 2>&1 &
            echo $! > "/tmp/zebrad-$NAME.pid"
          }
          start_node A 18232 18233
          start_node B 18242 18243

          wait_rpc () {
            for i in $(seq 1 90); do
              if curl -s -m 2 -X POST "http://127.0.0.1:$1" -H 'Content-Type: application/json' \
                   -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                   | grep -q '"chain"'; then echo "RPC $1 up after ${i}s"; return 0; fi
              sleep 1
            done
            echo "::error::RPC $1 never came up"; return 1
          }
          wait_rpc 18232 || { tail -60 /tmp/zebrad-A.log; exit 1; }
          wait_rpc 18242 || { tail -60 /tmp/zebrad-B.log; exit 1; }

      - name: probe the RPC surface we depend on
        run: |
          set -uo pipefail
          rpc () { # port method params
            curl -s -m 20 -X POST "http://127.0.0.1:$1" -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"1.0\",\"id\":\"ci\",\"method\":\"$2\",\"params\":$3}"
          }
          echo "── does submitblock exist? (expect a decode error, NOT 'method not found') ──"
          rpc 18232 submitblock '["00"]' | head -c 400; echo
          echo "── getchaintips available? ──"
          rpc 18232 getchaintips '[]' | head -c 400; echo
          echo "── genesis hash on A and B must be identical ──"
          A0=$(rpc 18232 getblockhash '[0]'); B0=$(rpc 18242 getblockhash '[0]')
          echo "A genesis: $A0"; echo "B genesis: $B0"
          test "$A0" = "$B0" || { echo "::error::genesis differs between nodes"; exit 1; }
          echo "GENESIS IDENTICAL"

      - name: mine a common ancestor on A and replicate it to B
        run: |
          set -euo pipefail
          rpc () {
            curl -s -m 60 -X POST "http://127.0.0.1:$1" -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"1.0\",\"id\":\"ci\",\"method\":\"$2\",\"params\":$3}"
          }
          jqr () { python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("result")) if d.get("error") is None else "ERR:"+json.dumps(d["error"]))'; }

          echo "── mine 20 blocks on A (common ancestor H=20) ──"
          rpc 18232 generate '[20]' | head -c 200; echo
          H=$(rpc 18232 getblockcount '[]' | jqr)
          echo "A height after mining: $H"

          echo "── replicate A's chain 1..$H into B via submitblock ──"
          for h in $(seq 1 "$H"); do
            HEX=$(rpc 18232 getblock "[\"$h\", 0]" | jqr | tr -d '"')
            RES=$(rpc 18242 submitblock "[\"$HEX\"]" | jqr)
            if [ "$h" -le 2 ] || [ "$h" = "$H" ]; then echo "  submitblock B h=$h -> $RES"; fi
            case "$RES" in ERR:*) echo "::error::submitblock failed at h=$h: $RES"; exit 1 ;; esac
          done
          BH=$(rpc 18242 getblockcount '[]' | jqr)
          echo "B height after replication: $BH"
          test "$BH" = "$H" || { echo "::error::B did not reach height $H (got $BH)"; exit 1; }

          AHASH=$(rpc 18232 getblockhash "[$H]" | jqr)
          BHASH=$(rpc 18242 getblockhash "[$H]" | jqr)
          echo "A[$H]=$AHASH"; echo "B[$H]=$BHASH"
          test "$AHASH" = "$BHASH" || { echo "::error::common ancestor differs"; exit 1; }
          echo "COMMON ANCESTOR ESTABLISHED at height $H: $AHASH"
          echo "$H" > /tmp/ancestor_height
          echo "$AHASH" > /tmp/ancestor_hash

      - name: build two competing branches and force a reorg on A
        run: |
          set -euo pipefail
          rpc () {
            curl -s -m 60 -X POST "http://127.0.0.1:$1" -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"1.0\",\"id\":\"ci\",\"method\":\"$2\",\"params\":$3}"
          }
          jqr () { python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("result")) if d.get("error") is None else "ERR:"+json.dumps(d["error"]))'; }
          H=$(cat /tmp/ancestor_height)

          echo "── branch A: 2 blocks on node A ──"
          rpc 18232 generate '[2]' > /dev/null
          echo "── branch B: 3 blocks on node B ──"
          rpc 18242 generate '[3]' > /dev/null

          A_TIP_H=$(rpc 18232 getblockcount '[]' | jqr); A_TIP=$(rpc 18232 getblockhash "[$A_TIP_H]" | jqr)
          B_TIP_H=$(rpc 18242 getblockcount '[]' | jqr); B_TIP=$(rpc 18242 getblockhash "[$B_TIP_H]" | jqr)
          echo "A tip: $A_TIP_H $A_TIP"
          echo "B tip: $B_TIP_H $B_TIP"
          A1=$(rpc 18232 getblockhash "[$((H+1))]" | jqr)
          B1=$(rpc 18242 getblockhash "[$((H+1))]" | jqr)
          echo "A[$((H+1))]=$A1"
          echo "B[$((H+1))]=$B1"
          test "$A1" != "$B1" || { echo "::error::branches are identical - no fork was created"; exit 1; }
          echo "TWO COMPETING BRANCHES CONFIRMED"

          echo "── feed branch B into node A; A must reorg onto it ──"
          for h in $(seq $((H+1)) "$B_TIP_H"); do
            HEX=$(rpc 18242 getblock "[\"$h\", 0]" | jqr | tr -d '"')
            RES=$(rpc 18232 submitblock "[\"$HEX\"]" | jqr)
            echo "  submitblock A h=$h -> $RES"
          done

          sleep 3
          NEW_H=$(rpc 18232 getblockcount '[]' | jqr)
          NEW_TIP=$(rpc 18232 getblockhash "[$NEW_H]" | jqr)
          echo "A tip AFTER: $NEW_H $NEW_TIP"
          echo "── A's block at $((H+1)) must now be B's ──"
          NOW1=$(rpc 18232 getblockhash "[$((H+1))]" | jqr)
          echo "A[$((H+1))] now = $NOW1 (B had $B1, A had $A1)"

          if [ "$NEW_H" = "$B_TIP_H" ] && [ "$NEW_TIP" = "$B_TIP" ] && [ "$NOW1" = "$B1" ]; then
            echo "REORG CONFIRMED: node A reorganised from branch A onto the longer branch B"
          else
            echo "::error::node A did not reorg onto branch B"
            exit 1
          fi

      - name: node logs
        if: always()
        run: |
          echo "── node A ──"; tail -40 /tmp/zebrad-A.log || true
          echo "── node B ──"; tail -40 /tmp/zebrad-B.log || true

      - name: stop nodes
        if: always()
        run: |
          kill "$(cat /tmp/zebrad-A.pid)" 2>/dev/null || true
          kill "$(cat /tmp/zebrad-B.pid)" 2>/dev/null || true

  note-reorg:
    name: live note-level wallet reorg
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZEBRAD_RELEASE: 6.3.0
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build the harness (release — shielded proving)
        run: cargo build --release -p zalkanes-wallet --features shielded --example regtest_note_reorg

      - name: fetch pinned zebrad release (verified checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_RELEASE}"
          FILE="zebrad-${ZEBRAD_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "$BASE/$FILE"
          curl -sSLO "$BASE/$FILE.sha256"
          sha256sum -c "$FILE.sha256"
          tar xzf "$FILE"
          find . -name zebrad -type f -exec cp {} /usr/local/bin/zebrad \;
          chmod +x /usr/local/bin/zebrad
          zebrad --version

      - name: install the node control script
        run: |
          set -euo pipefail
          cat > /tmp/nodes.sh <<'SH'
          start_node () {
            NAME="$1"; RPC="$2"; P2P="$3"
            rm -rf "/tmp/zebra-$NAME"; mkdir -p "/tmp/zebra-$NAME"
            cat > "/tmp/zebra-$NAME/zebrad.toml" <<ZCFG
          [network]
          network = { regtest = true, params = { activation_heights = { NU5 = 1, NU6 = 1, "NU6.1" = 1, "NU6.2" = 1, "NU6.3" = 1 } } }
          listen_addr = "127.0.0.1:$P2P"
          initial_mainnet_peers = []
          initial_testnet_peers = []
          cache_dir = "/tmp/zebra-$NAME/net"

          [state]
          cache_dir = "/tmp/zebra-$NAME/state"
          ephemeral = true

          [sync]
          checkpoint_verify_concurrency_limit = 2
          download_concurrency_limit = 2

          [consensus]
          checkpoint_sync = false

          [rpc]
          listen_addr = "127.0.0.1:$RPC"
          enable_cookie_auth = false

          [mining]
          internal_miner = false
          miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
          ZCFG
            zebrad -c "/tmp/zebra-$NAME/zebrad.toml" start > "/tmp/zebrad-$NAME.log" 2>&1 &
            echo $! > "/tmp/zebrad-$NAME.pid"
          }
          wait_rpc () {
            for i in $(seq 1 90); do
              if curl -s -m 2 -X POST "http://127.0.0.1:$1" -H 'Content-Type: application/json' \
                   -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                   | grep -q '"chain"'; then echo "RPC $1 up after ${i}s"; return 0; fi
              sleep 1
            done
            echo "::error::RPC $1 never came up"; return 1
          }
          stop_nodes () {
            kill "$(cat /tmp/zebrad-A.pid 2>/dev/null)" 2>/dev/null || true
            kill "$(cat /tmp/zebrad-B.pid 2>/dev/null)" 2>/dev/null || true
            sleep 2
          }
          fresh_pair () {
            stop_nodes
            start_node A 18232 18233
            start_node B 18242 18243
            wait_rpc 18232 || { tail -60 /tmp/zebrad-A.log; return 1; }
            wait_rpc 18242 || { tail -60 /tmp/zebrad-B.log; return 1; }
          }
          SH
          echo installed

      - name: CASE A — a received note disappears with its branch
        run: |
          set -euo pipefail
          source /tmp/nodes.sh
          fresh_pair
          rm -rf /tmp/wallet-case-a
          ZALKANES_WALLET_DIR=/tmp/wallet-case-a \
            ./target/release/examples/regtest_note_reorg case-a 2>&1 | tee /tmp/case-a.log
          grep -q "CASE A PASS" /tmp/case-a.log

      - name: CASE B — a spend rolls back and the note returns
        run: |
          set -euo pipefail
          source /tmp/nodes.sh
          fresh_pair
          rm -rf /tmp/wallet-case-b
          ZALKANES_WALLET_DIR=/tmp/wallet-case-b \
            ./target/release/examples/regtest_note_reorg case-b 2>&1 | tee /tmp/case-b.log
          grep -q "CASE B PASS" /tmp/case-b.log

      - name: node logs
        if: always()
        run: |
          echo "── node A ──"; tail -60 /tmp/zebrad-A.log || true
          echo "── node B ──"; tail -60 /tmp/zebrad-B.log || true

      - name: stop nodes
        if: always()
        run: |
          kill "$(cat /tmp/zebrad-A.pid)" 2>/dev/null || true
          kill "$(cat /tmp/zebrad-B.pid)" 2>/dev/null || true

  activation-boundary:
    name: live activation-boundary reorg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZEBRAD_RELEASE: 6.3.0
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Regtest-only. The manifest pins regtest activation at 1, which leaves
      # no blocks below the boundary to test with.
      ZALKANES_REGTEST_ACTIVATION_HEIGHT: 120
      ZALKANES_NETWORK: regtest
      ZALKANES_ZCASH_RPC_URL: http://127.0.0.1:18232
      ZALKANES_SIGNING_KEY: 0101010101010101010101010101010101010101010101010101010101010101
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: build the CLI and the counter contract
        run: |
          set -euo pipefail
          cargo build --release -p zalkanes-cli
          cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/counter/Cargo.toml
          ls -l contracts/counter/target/wasm32-unknown-unknown/release/counter.wasm

      - name: fetch pinned zebrad release (verified checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_RELEASE}"
          FILE="zebrad-${ZEBRAD_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "$BASE/$FILE"
          curl -sSLO "$BASE/$FILE.sha256"
          sha256sum -c "$FILE.sha256"
          tar xzf "$FILE"
          find . -name zebrad -type f -exec cp {} /usr/local/bin/zebrad \;
          chmod +x /usr/local/bin/zebrad
          zebrad --version

      - name: refuse the override on a real network
        run: |
          set -euo pipefail
          # The override must be a hard error off regtest, not a silent no-op.
          if ZALKANES_NETWORK=testnet ./target/release/zalkanes node serve --port 3999 2>/tmp/guard.txt; then
            echo "::error::testnet accepted a regtest activation override"; exit 1
          fi
          cat /tmp/guard.txt
          grep -q "cannot be overridden" /tmp/guard.txt
          echo "GUARD OK: the override is refused off regtest"

      - name: start two isolated regtest nodes
        run: |
          set -euo pipefail
          start_node () {
            NAME="$1"; RPC="$2"; P2P="$3"
            rm -rf "/tmp/zebra-$NAME"; mkdir -p "/tmp/zebra-$NAME"
            cat > "/tmp/zebra-$NAME/zebrad.toml" <<ZCFG
          [network]
          network = { regtest = true, params = { activation_heights = { NU5 = 1, NU6 = 1, "NU6.1" = 1, "NU6.2" = 1, "NU6.3" = 1 } } }
          listen_addr = "127.0.0.1:$P2P"
          initial_mainnet_peers = []
          initial_testnet_peers = []
          cache_dir = "/tmp/zebra-$NAME/net"

          [state]
          cache_dir = "/tmp/zebra-$NAME/state"
          ephemeral = true

          [sync]
          checkpoint_verify_concurrency_limit = 2
          download_concurrency_limit = 2

          [consensus]
          checkpoint_sync = false

          [rpc]
          listen_addr = "127.0.0.1:$RPC"
          enable_cookie_auth = false

          [mining]
          internal_miner = false
          miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
          ZCFG
            zebrad -c "/tmp/zebra-$NAME/zebrad.toml" start > "/tmp/zebrad-$NAME.log" 2>&1 &
            echo $! > "/tmp/zebrad-$NAME.pid"
          }
          start_node A 18232 18233
          start_node B 18242 18243
          for P in 18232 18242; do
            for i in $(seq 1 90); do
              curl -s -m 2 -X POST "http://127.0.0.1:$P" -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                | grep -q '"chain"' && { echo "RPC $P up"; break; }
              sleep 1
            done
          done

      - name: run the activation-boundary reorg
        run: |
          set -euo pipefail
          bash scripts/activation-boundary-reorg.sh 2>&1 | tee /tmp/activation.log
          grep -q "ACTIVATION BOUNDARY REORG PASS" /tmp/activation.log

      - name: logs
        if: always()
        run: |
          echo "── node A ──"; tail -40 /tmp/zebrad-A.log || true
          echo "── node B ──"; tail -40 /tmp/zebrad-B.log || true
          echo "── indexer ──"; tail -60 /tmp/indexer.log || true
          echo "── reindex ──"; tail -30 /tmp/reindex.log || true

      - name: stop everything
        if: always()
        run: |
          kill "$(cat /tmp/zebrad-A.pid)" 2>/dev/null || true
          kill "$(cat /tmp/zebrad-B.pid)" 2>/dev/null || true
          pkill -f "zalkanes node serve" 2>/dev/null || true
