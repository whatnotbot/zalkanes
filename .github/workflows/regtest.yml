name: live-zebra-regtest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Isolated, ephemeral regtest only. This workflow NEVER touches the public
# testnet Zebra service or any Railway volume: it downloads the pinned
# zebrad release, runs it on a throwaway runner filesystem, and is torn down
# with the job.
jobs:
  regtest:
    name: live zebrad regtest (pinned v6.3.0)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # NOTE: must NOT be named ZEBRA_* — zebrad treats every ZEBRA_* env
      # var as configuration (ZEBRA_VERSION was parsed as an unknown top-level
      # `version` field and aborted startup).
      ZEBRAD_RELEASE: 6.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: fetch pinned zebrad release (verified checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_RELEASE}"
          FILE="zebrad-${ZEBRAD_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "$BASE/$FILE"
          curl -sSLO "$BASE/$FILE.sha256"
          sha256sum -c "$FILE.sha256"
          tar xzf "$FILE"
          find . -name zebrad -type f -exec cp {} /usr/local/bin/zebrad \;
          chmod +x /usr/local/bin/zebrad
          zebrad --version

      - name: start an isolated regtest node
        run: |
          set -euo pipefail
          mkdir -p /tmp/zebra-regtest
          # Same activation heights as deploy/zebra/zebra-regtest.toml, so the
          # regtest chain runs the frozen NU6.3 rules the wallet targets.
          # Minimal explicit config in the exact shape used in production
          # (deploy/zebra/zebra-regtest.toml), which is known-good for this
          # pinned zebrad. Patching zebrad's generated config proved fragile:
          # keys landed in the wrong sections and duplicated existing ones.
          cat > /tmp/zebra-regtest/zebrad.toml <<'ZCFG'
          [network]
          network = { regtest = true, params = { activation_heights = { NU5 = 1, NU6 = 1, "NU6.1" = 1, "NU6.2" = 1, "NU6.3" = 1 } } }
          listen_addr = "127.0.0.1:18233"

          [state]
          cache_dir = "/tmp/zebra-regtest/state"
          ephemeral = true

          [sync]
          # Isolated node: there are no peers to sync from, and the default
          # crawler otherwise spends the whole job chasing an imaginary tip.
          checkpoint_verify_concurrency_limit = 2
          download_concurrency_limit = 2

          [consensus]
          checkpoint_sync = false

          [rpc]
          listen_addr = "127.0.0.1:18232"
          enable_cookie_auth = false

          [mining]
          internal_miner = false
          miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
          ZCFG
          echo "── effective zebrad config ──"; cat /tmp/zebra-regtest/zebrad.toml
          # Prove no stray ZEBRA_* variable can be reinterpreted as config.
          echo "── ZEBRA_* environment (must be empty) ──"; env | grep '^ZEBRA_' || echo "(none)"
          zebrad -c /tmp/zebra-regtest/zebrad.toml start > /tmp/zebrad.log 2>&1 &
          echo $! > /tmp/zebrad.pid
          # Wait for the RPC port to answer.
          for i in $(seq 1 60); do
            if curl -s -m 2 -X POST http://127.0.0.1:18232 \
                 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                 | grep -q '"chain"'; then
              echo "zebrad RPC is up after ${i}s"; break
            fi
            sleep 1
          done
          if ! curl -s -m 2 -X POST http://127.0.0.1:18232 \
               -H 'Content-Type: application/json' \
               -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
               | grep -q '"chain"'; then
            echo "::error::zebrad did not come up"; tail -40 /tmp/zebrad.log; exit 1
          fi
          curl -s -X POST http://127.0.0.1:18232 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' | head -c 400
          echo

      - name: mine a regtest chain
        run: |
          set -euo pipefail
          curl -s -X POST http://127.0.0.1:18232 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"1.0","id":"ci","method":"generate","params":[120]}' | head -c 200
          echo
          curl -s -X POST http://127.0.0.1:18232 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"1.0","id":"ci","method":"getblockcount","params":[]}'
          echo

      - name: live wallet + CLI acceptance against the real node
        env:
          ZALKANES_NETWORK: regtest
          ZALKANES_ZCASH_RPC_URL: http://127.0.0.1:18232
          ZALKANES_WALLET_DIR: /tmp/zalkanes-wallet
          ZALKANES_PASSPHRASE: ci-regtest-passphrase
        run: |
          set -euo pipefail
          cargo build --release -p zalkanes-cli
          BIN=target/release/zalkanes
          rpc() {
            curl -s -X POST http://127.0.0.1:18232 -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"1.0\",\"id\":\"ci\",\"method\":\"$1\",\"params\":$2}"
          }

          echo "── wallet create (real treestate from the live node) ──"
          "$BIN" wallet create

          echo "── locked reopen is watch-capable ──"
          "$BIN" wallet address
          "$BIN" wallet balance
          "$BIN" wallet status

          echo "── scan real regtest blocks while LOCKED ──"
          "$BIN" wallet scan

          echo "── wallet scanned identity == Zebra canonical tip ──"
          "$BIN" wallet status | tee /tmp/status.txt
          grep -q "synced" /tmp/status.txt
          if grep -q "NOT synced" /tmp/status.txt; then
            echo "::error::wallet did not reach the canonical tip"; exit 1
          fi

          echo "── mine further and rescan: wallet tracks the advancing tip ──"
          rpc generate '[10]' > /dev/null
          "$BIN" wallet scan
          "$BIN" wallet status | tee /tmp/status2.txt
          if grep -q "NOT synced" /tmp/status2.txt; then
            echo "::error::wallet did not track the advancing tip"; exit 1
          fi

          echo "── restart/reopen preserves wallet identity ──"
          ADDR1=$("$BIN" wallet address)
          ADDR2=$("$BIN" wallet address)   # fresh process = reopen
          test "$ADDR1" = "$ADDR2"
          "$BIN" wallet scan               # reopen + rescan is idempotent

          echo "── a shielded spend must be refused while LOCKED ──"
          if "$BIN" contract call $(printf '0%.0s' {1..64}) 1 --funding shielded --yes; then
            echo "::error::locked wallet accepted a shielded spend"; exit 1
          fi

          echo "── unlock arms the session, lock disarms it ──"
          "$BIN" wallet unlock
          "$BIN" wallet status | grep -q UNLOCKED
          "$BIN" wallet lock
          "$BIN" wallet status | grep -q LOCKED

          echo "── dry-run plans without side effects ──"
          "$BIN" contract call $(printf '0%.0s' {1..64}) 1 --dry-run || true
          test ! -f /tmp/zalkanes-wallet/journal.sqlite

          echo "LIVE REGTEST BASELINE OK"

      - name: classify the note-level branch-reorg gap
        run: |
          echo "Live baseline above is GREEN against a real pinned zebrad."
          echo
          echo "NOT covered here: note-level BRANCH REORG (a shielded note"
          echo "received on a removed branch disappearing; a spend rolling back)."
          echo "Inducing that requires building and submitting a COMPETING chain"
          echo "with more work than the canonical one. Zebra exposes submitblock,"
          echo "but constructing valid competing regtest blocks is machinery this"
          echo "repository does not have. The deterministic wallet-side matrix in"
          echo "crates/zalkanes-wallet/src/wallet_reorg_tests.rs exercises the real"
          echo "rewind/rescan code against fabricated competing chains, which is"
          echo "NOT a substitute for observing a live node reorganise."
          echo "Classification: E (expected absence of competing-chain machinery)."

      - name: node log tail
        if: always()
        run: tail -40 /tmp/zebrad.log || true

      - name: stop the node
        if: always()
        run: kill "$(cat /tmp/zebrad.pid)" 2>/dev/null || true
