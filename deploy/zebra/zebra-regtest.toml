# Zebra regtest configuration for Zalkanes.
#
# Regtest activates every supported network upgrade (NU5..NU6.3) from height 1
# so that V5/ZIP-244 transactions (and later V6/Ironwood) are valid from
# genesis. This matches Zalkanes' `ConsensusParams::Regtest` ("all upgrades
# active from height 1"). No funding streams are configured (empty), so the
# coinbase goes entirely to the miner address.

[network]
network = { regtest = true, params = { activation_heights = { NU5 = 1, NU6 = 1, "NU6.1" = 1, "NU6.2" = 1, "NU6.3" = 1 } } }
listen_addr = "0.0.0.0:18233"

[state]
# Persistent regtest chain state lives on the Railway volume.
cache_dir = "/data/zebra"
ephemeral = false

[consensus]
checkpoint_sync = false

[rpc]
listen_addr = "0.0.0.0:18232"
# Private internal network only — Zalkanes connects over railway.internal.
# Cookie auth is disabled so the indexer can call getblockchaininfo directly.
enable_cookie_auth = false

[mining]
internal_miner = true
miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
