[package]
name = "zalkanes-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zalkanes-core     = { workspace = true }
zalkanes-tx       = { workspace = true }
zalkanes-carrier  = { workspace = true }
zalkanes-protocol = { workspace = true }
zcash_primitives  = { workspace = true }
anyhow            = { workspace = true }
thiserror         = { workspace = true }
hex               = { workspace = true }
sha2              = { workspace = true }
zcash_protocol    = { workspace = true }
rand_core         = { version = "=0.6.4", features = ["getrandom"] }

# Shielded funding (Orchard/Ironwood) via the lower-level PCZT pipeline.
pczt                 = { workspace = true, optional = true }
zcash_client_backend = { workspace = true, optional = true }
zcash_client_sqlite  = { workspace = true, optional = true }
zcash_proofs         = { workspace = true, optional = true }
zcash_keys           = { workspace = true, optional = true }
orchard              = { workspace = true, optional = true }
zcash_transparent    = { workspace = true, optional = true }
secp256k1            = { workspace = true, optional = true }
secrecy              = { version = "=0.8.0", optional = true }
age                  = { version = "=0.12.1", default-features = false, optional = true }
zcash_note_encryption = { version = "=0.4.2", optional = true }
rusqlite             = { version = "=0.37.0", features = ["bundled"], optional = true }
zip32                = { version = "=0.2.1", optional = true }
reqwest              = { workspace = true, optional = true }
serde_json           = { workspace = true, optional = true }
serde                = { workspace = true, optional = true }

[features]
default = []
# Shielded funding via pczt / zcash_client_backend / zcash_client_sqlite.
# Gated behind a feature because it pulls in the full Orchard proving stack;
# the consensus path stays lightweight and the CI matrix stays green without it.
shielded = [
    "dep:pczt",
    "dep:zcash_client_backend",
    "dep:zcash_client_sqlite",
    "dep:zcash_proofs",
    "dep:zcash_keys",
    "dep:orchard",
    "dep:zcash_transparent",
    "dep:secp256k1",
    "dep:secrecy",
    "dep:age",
    "dep:zcash_note_encryption",
    "dep:rusqlite",
    "dep:zip32",
    "dep:reqwest",
    "dep:serde_json",
    "dep:serde",
    "zcash_primitives/circuits",
]

[dev-dependencies]

[[example]]
name = "create_testnet_wallet"
required-features = ["shielded"]

[[example]]
name = "scan_testnet_wallet"
required-features = ["shielded"]

[[example]]
name = "shielded_call_testnet"
required-features = ["shielded"]

[[example]]
name = "shielded_deploy_testnet"
required-features = ["shielded"]

[[example]]
name = "regtest_note_reorg"
required-features = ["shielded"]
