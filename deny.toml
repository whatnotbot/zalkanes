[advisories]
# Vulnerability advisories are always denied (no configurable level in 0.20+).
# `unmaintained`/`unsound` take a scope: all | workspace | transitive | none.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  # rustls-pemfile is a transitive dep of reqwest (rustls-tls) and is archived
  # upstream with no maintained successor; it is used only to parse PEM files.
  { id = "RUSTSEC-2025-0134", reason = "transitive dep of reqwest rustls-tls; PEM parsing only; no safe upgrade available" },
]

[bans]
multiple-versions = "warn"
deny = [
  # Prevent accidental inclusion of Bitcoin-specific crates
  { name = "bitcoin" },
  { name = "ordinals" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  # Transitive: unicode-id-start / unicode-ident (Unicode-3.0),
  # askalono's own crate (CDLA-Permissive-2.0, from cargo-deny's advisory DB only).
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
